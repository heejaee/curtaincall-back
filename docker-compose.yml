version: '3.8'

services:
  mysql:
    image: hjhjhj3770/curtaincall:mysql
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: curtaincall
      MYSQL_USER: user
      MYSQL_PASSWORD: passw0rd
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - curtaincall-net

  kafka:
    image: bitnami/kafka:3.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - curtaincall-net

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - curtaincall-net

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - curtaincall-net

  backend:
    image: hjhjhj3770/curtaincall:backend
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mongo
      - redis
      - kafka
    networks:
      - curtaincall-net

  frontend:
    image: hjhjhj3770/curtaincall:frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - curtaincall-net

volumes:
  mysql_data:
  mongo_data:
  kafka_data:

networks:
  curtaincall-net:
    driver: bridge
